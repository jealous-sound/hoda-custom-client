name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  RAYLIB_VERSION: "5.5"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            raylib: raylib-5.5_macos
            raylib_archive: tar.gz
            raylib_sha256: 930c67b676963c6cffbd965814664523081ecbf3d30fc9df4211d0064aa6ba39
            extra_cflags: -arch arm64 -arch x86_64
            package: Heroes-of-Dragon-Age-macos-universal.zip
          - platform: linux
            runner: ubuntu-24.04
            raylib: raylib-5.5_linux_amd64
            raylib_archive: tar.gz
            raylib_sha256: 3d95ef03d5b38dfa55c0a16ca122d382134b078f0e5b270b52fe7eae0549c000
            extra_cflags: ""
            package: Heroes-of-Dragon-Age-linux-x86_64.tar.gz
          - platform: windows
            runner: ubuntu-24.04
            raylib: raylib-5.5_win64_mingw-w64
            raylib_archive: zip
            raylib_sha256: fe8feda1b92fc02826e2d19c631d648fd0563b93b144893fe18140e9fe4fb6fd
            extra_cflags: ""
            package: Heroes-of-Dragon-Age-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl-dev libx11-dev libcurl4-openssl-dev

      - name: Install MinGW-w64
        if: matrix.platform == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Fetch raylib ${{ env.RAYLIB_VERSION }}
        run: |
          archive="${{ matrix.raylib }}.${{ matrix.raylib_archive }}"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/raysan5/raylib/releases/download/$RAYLIB_VERSION/$archive"
          echo "${{ matrix.raylib_sha256 }}  $RUNNER_TEMP/$archive" | shasum -a 256 -c -
          if [ "${{ matrix.raylib_archive }}" = zip ]; then
            unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          else
            tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          fi
          echo "RAYLIB_DIR=$RUNNER_TEMP/${{ matrix.raylib }}" >> "$GITHUB_ENV"

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          make app \
            PLATFORM=${{ matrix.platform }} \
            RAYLIB_DIR="$RAYLIB_DIR" \
            RAYLIB_LINK="$RAYLIB_DIR/lib/libraylib.a" \
            EXTRA_CFLAGS="${{ matrix.extra_cflags }}"

      - name: Package
        run: |
          mkdir -p package
          case "${{ matrix.platform }}" in
            macos)
              ditto -c -k --keepParent "Heroes of Dragon Age.app" "package/${{ matrix.package }}" ;;
            linux)
              tar -czf "package/${{ matrix.package }}" -C build/linux "Heroes of Dragon Age" ;;
            windows)
              (cd build/windows && zip -q "../../package/${{ matrix.package }}" "Heroes of Dragon Age.exe") ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Heroes-of-Dragon-Age-${{ matrix.platform }}
          path: package/${{ matrix.package }}
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Choose release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "name=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$(git tag -l 'v*' --points-at "$GITHUB_SHA")" ]; then
            echo "Commit is already tagged; its tag run publishes the release."
            exit 0
          fi
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          echo "name=v$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        if: steps.tag.outputs.name != ''
        with:
          path: release
          merge-multiple: true

      - name: Publish GitHub release
        if: steps.tag.outputs.name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Heroes of Dragon Age $TAG" \
            --generate-notes
